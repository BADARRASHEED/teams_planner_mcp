[project]
name = "teams-planner-mcp"
version = "0.1.0"
description = "MCP server for Microsoft Teams and Planner task automation"
readme = "README.md"
authors = [
    { name = "Badar Rasheed Butt", email = "badarrasheedbutt@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.27.0",
    "mcp>=1.0.0",
    "msal>=1.31.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
teams-planner-mcp = "teams_planner_mcp:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
